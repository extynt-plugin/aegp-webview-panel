name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ clang cmake
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install clang-format==21.1.8 clang-tidy==21.1.6 lizard
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Format (clang-format)
        run: |
          git ls-files 'src/*.cpp' 'src/*.h' 'src/*.mm' 'tests/unit/*.cpp' 'tests/syntax-check/*.h' \
            | xargs clang-format --dry-run -Werror

      - name: Coding limits (file, function, complexity, nesting, parameters)
        run: scripts/check-limits.sh

      - name: Syntax check and clang-tidy (stub Cocoa and Adobe headers, no SDK)
        run: tests/syntax-check/check-syntax.sh --tidy

      - name: Unit tests of the platform-neutral code
        run: |
          cmake -S . -B build -DWVP_BUILD_PLUGIN=OFF
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Shell syntax
        run: bash -n build-mac.sh scripts/*.sh tests/syntax-check/check-syntax.sh
